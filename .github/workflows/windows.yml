name: Native Windows installed customer acceptance
on:
  push:
    branches: [main, feat/kleinanzeiger-native-windows-20261025, fix/manage-ad-selector-20261025]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    name: windows-installed-py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Windows candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Node 22 for installed real-browser acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build tested distributable Wheel and install customer extras
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem -Path dist -Filter 'kleinanzeiger-*.whl')
          if ($wheel.Count -ne 1) { throw 'Exactly one Kleinanzeiger wheel required' }
          python -m pip install "$($wheel[0].FullName)[private-web,generation]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mark_api.launcher --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows kernel exclusion, SQLite lock, staged-media restart
        run: python -m unittest discover -s tests -p test_windows_compat.py -v
      - name: Windows installed backup and create-only restore
        run: python -m unittest discover -s tests -p test_windows_backup.py -v
      - name: Installed Windows binary media round-trip
        run: python -m unittest discover -s tests -p test_windows_binary_media.py -v
      - name: Installed full dashboard and write lifecycle
        run: python -m unittest discover -s tests -p test_dashboard_full_lifecycle_e2e.py -v
      - name: Installed synthetic create and media lifecycle
        run: python -m unittest discover -s tests -p test_dashboard_media_full_lifecycle_e2e.py -v
      - name: Installed synthetic text/image generation dashboard
        run: python -m unittest discover -s tests -p test_generation_dashboard.py -v
      - name: Installed ad selector and Windows installer contract
        shell: python
        run: |
          import subprocess
          import sys
          import shutil
          sys.path.insert(0, 'tests')
          from test_offline_browser_e2e import _chrome
          assert _chrome() and shutil.which('node'), 'Real installed browser acceptance cannot be skipped'
          assert shutil.which('powershell.exe'), 'Native PowerShell start acceptance cannot be skipped'
          for pattern in (
              "test_dashboard_managed_ad_picker.py",
              "test_dashboard_existing_ai_jobs.py",
              "test_dashboard_manual_sync.py",
              "test_dashboard_sync_clarity.py",
              "test_product_offline_workspace.py",
              "test_dashboard_workspace_ux.py",
              "test_portfolio_catalog_ui.py",
              "test_portfolio_bulk_ui.py",
              "test_portfolio_buyer_reply_ui.py",
              "test_portfolio_catalog.py",
              "test_portfolio_drafts.py",
              "test_portfolio_drafts_http.py",
              "test_portfolio_drafts_ui.py",
              "test_portfolio_jobs.py",
              "test_portfolio_jobs_http.py",
              "test_portfolio_jobs_ui.py",
              "test_portfolio_provider.py",
              "test_portfolio_inventory_diff.py",
              "test_portfolio_item_templates.py",
              "test_portfolio_item_templates_http.py",
              "test_portfolio_item_templates_ui.py",
              "test_portfolio_price_rules.py",
              "test_portfolio_owner_price_rules.py",
              "test_portfolio_owner_price_http.py",
              "test_portfolio_owner_price_ui.py",
              "test_platform_messages.py",
              "test_portfolio_reporting.py",
              "test_portfolio_reporting_http.py",
              "test_portfolio_reporting_ui.py",
              "test_portfolio_insights_http.py",
              "test_portfolio_insights_ui.py",
              "test_offline_browser_e2e.py",
              "test_dashboard_online_browser_ack.py",
              "test_windows_offline_start.py",
              "test_windows_offline_compat.py",
              "test_portfolio_templates.py",
              "test_portfolio_templates_http.py",
              "test_portfolio_templates_ui.py",
              "test_portfolio_followups.py",
              "test_portfolio_followups_http.py",
              "test_portfolio_followups_ui.py",
              "test_windows_customer_hub.py",
              "test_windows_deals_ui.py",
              "test_windows_restore_existing.py",
              "test_windows_installer_scripts.py",
              "test_windows_hub.py",
              "test_windows_startup_readiness.py",
          ):
              result = subprocess.run(
                  [sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", pattern, "-v"],
                  capture_output=True, text=True, check=False
              )
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              if result.returncode:
                  summary = (result.stdout + "\n" + result.stderr)[-6000:]
                  summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error file=tests/" + pattern + ",title=Windows acceptance failure::" + summary, flush=True)
                  raise SystemExit(result.returncode)
      - name: Parse customer PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('windows-install.ps1', 'windows-start.ps1', 'windows-chrome.ps1', 'windows-ki-einrichten.ps1', 'windows-center.ps1', 'windows-worker.ps1', 'windows-messages.ps1', 'windows-weekly-report.ps1', 'windows-deals.ps1', 'windows-diagnostics.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path (Join-Path scripts $script)).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script has invalid PowerShell syntax: $errors" }
          }
      - name: Native Windows one-window setup and worker self-tests
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-center.ps1 -SelfTest
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-deals.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-weekly-report.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-worker.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/windows-diagnostics.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack native Windows customer ZIP from tested Wheel
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $wheel = @(Get-ChildItem -Path dist -Filter 'kleinanzeiger-*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Wheel' }
          Copy-Item $wheel[0].FullName $staging
          Copy-Item scripts\Kleinanzeiger.cmd, scripts\windows-center.ps1, scripts\windows-worker.ps1, scripts\windows-messages.ps1, scripts\windows-weekly-report.ps1, scripts\windows-deals.ps1, scripts\windows-offline-compat.py, scripts\windows-restore-existing.py, scripts\windows-install.ps1, scripts\windows-start.ps1, scripts\windows-backup.ps1, scripts\windows-restore.ps1, scripts\windows-chrome.ps1, scripts\windows-ki-einrichten.ps1, scripts\windows-diagnostics.ps1, scripts\Kleinanzeiger-Diagnose.cmd $staging
          Copy-Item docs\windows-installation.md (Join-Path $staging 'Windows-Installation.md')
          Copy-Item docs\platform-nachrichten.md (Join-Path $staging 'Konto-Nachrichten.md')
          Copy-Item docs\Kleinanzeiger-Handbuch.html, docs\Kleinanzeiger-Funktionen.html $staging
          Copy-Item docs\START-HIER.html $staging
          Copy-Item CHANGELOG.md $staging
          $digest = (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($wheel[0].Name)" | Set-Content -Path (Join-Path $staging 'SHA256SUMS.txt') -Encoding ascii
          $diagnostics = @(& powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-diagnostics.ps1'))
          if ($LASTEXITCODE -ne 0 -or $diagnostics -notcontains 'Paketpruefsumme: ok') {
            throw 'Read-only Windows customer diagnostics did not verify the staged wheel'
          }
          Compress-Archive -Path "$staging\*" -DestinationPath 'Kleinanzeiger-v1.0.14-Windows.zip'
          $zipHash = (Get-FileHash 'Kleinanzeiger-v1.0.14-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Windows Wheel SHA256 $digest"
          Write-Output "Windows customer ZIP SHA256 $zipHash"
      - name: Verify customer install script against packaged and hashed wheel
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          & (Join-Path $staging 'windows-worker.ps1') -Action Install -PackageDirectory $staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hub = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger\App\Kleinanzeiger.cmd'
          if (-not (Test-Path -LiteralPath $hub -PathType Leaf)) { throw 'Stable customer shortcut target missing' }
          $installed = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw 'Customer installation did not produce the venv Python executable'
          }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '1.0.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the real Windows PowerShell 5.1 native-argument path after install.
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-center.ps1') -SelfTest -ExpectedInstalledVersion '1.0.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-worker.ps1') -SelfTest -ExpectedInstalledVersion '1.0.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-deals.ps1') -SelfTest -ExpectedInstalledVersion '1.0.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Prove the optional inbox module works from the actually installed Wheel; no provider call.
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-messages.ps1') -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows installed weekly report and opt-in scheduling
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger'
          $app = Join-Path $state 'App'
          $db = Join-Path $state 'anzeigen.sqlite'
          $python = Join-Path $state '.venv\Scripts\python.exe'
          $worker = Join-Path $app 'windows-worker.ps1'
          $weekly = Join-Path $app 'windows-weekly-report.ps1'
          if (!(Test-Path -LiteralPath $worker -PathType Leaf) -or !(Test-Path -LiteralPath $weekly -PathType Leaf)) {
            throw 'Weekly report scripts were not installed'
          }
          $env:KLEINANZEIGER_WEEKLY_CI_DB = $db
          & $python -c "import os; from pathlib import Path; from datetime import datetime,timezone; from mark_api.storage import SnapshotStore; from mark_api.domain import AdSnapshot,InboundMessageEvent,LifecycleState; t=datetime.now(timezone.utc); s=SnapshotStore(Path(os.environ['KLEINANZEIGER_WEEKLY_CI_DB']),create_if_missing=True); s.append_ad_snapshot(AdSnapshot(ad_id='synthetic-report-ad',title='synthetic-private-title',lifecycle_state=LifecycleState.ACTIVE,observed_at=t,source='private-web-product-launcher')); s.append_inbound_message_events([InboundMessageEvent(ad_id='synthetic-report-ad',conversation_id='synthetic-report-conversation',provider_message_id='synthetic-report-message',observed_at=t,source='test-synthetic-email')])"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot seed synthetic weekly-report database' }
          $run = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Action ReportNow -PackageDirectory $app)
          if ($LASTEXITCODE -ne 0 -or $run -notcontains 'WEEKLY_REPORT_RUN_OK') { throw 'Installed Windows weekly report failed' }
          $reportDir = Join-Path $state 'Berichte'
          $reports = @(Get-ChildItem -LiteralPath $reportDir -File -Filter 'Kleinanzeiger-Wochenbericht-*.html')
          if ($reports.Count -ne 1) { throw 'Expected exactly one weekly HTML report' }
          $html = Get-Content -LiteralPath $reports[0].FullName -Raw -Encoding UTF8
          if (!$html.Contains('Importierte Nachrichten</td><td>1</td><td>0</td>') -or $html.Contains('synthetic-report-')) {
            throw 'Weekly report aggregates are incorrect or reveal customer identifiers'
          }
          $run = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Action ReportNow -PackageDirectory $app)
          if ($LASTEXITCODE -ne 0 -or $run -notcontains 'WEEKLY_REPORT_RUN_OK' -or @(Get-ChildItem -LiteralPath $reportDir -File -Filter 'Kleinanzeiger-Wochenbericht-*.html').Count -ne 1) {
            throw 'Weekly report rerun was not idempotent'
          }
          try {
            $enabled = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Action ReportEnable -PackageDirectory $app)
            if ($LASTEXITCODE -ne 0 -or $enabled -notcontains 'WEEKLY_ENABLED') { throw 'Opt-in weekly scheduler activation failed' }
            $status = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $weekly -Action Status)
            if ($LASTEXITCODE -ne 0 -or $status -notcontains 'WEEKLY_ENABLED') { throw 'Opt-in weekly scheduler state missing' }
          } finally {
            $disabled = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $worker -Action ReportDisable -PackageDirectory $app)
            if ($LASTEXITCODE -ne 0 -or $disabled -notcontains 'WEEKLY_DISABLED') { throw 'Opt-in weekly scheduler cleanup failed' }
          }
          $status = @(powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $weekly -Action Status)
          if ($LASTEXITCODE -ne 0 -or $status -notcontains 'WEEKLY_DISABLED') { throw 'Weekly scheduler was not removed' }
      - name: Verify Windows upgrade rollback and non-destructive failed staging
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          $state = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger'
          $installed = Join-Path $state '.venv\Scripts\python.exe'
          # Real second installation preserves its previous environment and data.
          & (Join-Path $staging 'windows-install.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saved = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*')
          if ($saved.Count -lt 1) { throw 'No previous Windows environment was retained' }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '1.0.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Valid local checksum but invalid Wheel: installation must fail before activation.
          $broken = Join-Path $env:RUNNER_TEMP ('kleinanzeiger-broken-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $broken -Force | Out-Null
          Copy-Item (Join-Path $staging 'windows-install.ps1') $broken
          $badWheel = Join-Path $broken 'kleinanzeiger-1.0.14-py3-none-any.whl'
          [IO.File]::WriteAllText($badWheel, 'invalid wheel archive')
          $sha = (Get-FileHash -LiteralPath $badWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  kleinanzeiger-1.0.14-py3-none-any.whl" | Set-Content -Path (Join-Path $broken 'SHA256SUMS.txt') -Encoding ascii
          $before = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          $failed = $false
          try { & (Join-Path $broken 'windows-install.ps1') | Out-Null } catch { $failed = $true }
          if (-not $failed) { throw 'Broken staged Wheel unexpectedly installed' }
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $before) {
            throw 'Existing interpreter changed during failed staged install'
          }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '1.0.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows manual rollback and untrusted path rejection
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          $state = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger'
          $installed = Join-Path $state '.venv\Scripts\python.exe'
          $candidate = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*' |
            Sort-Object Name -Descending | Select-Object -First 1)
          if ($candidate.Count -ne 1) { throw 'No saved rollback environment' }
          $marker = 'kleinanzeiger-rollback-e2e.marker'
          [IO.File]::WriteAllText((Join-Path $candidate[0].FullName $marker), 'saved-environment')
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-worker.ps1') -Action Rollback -BackupName $candidate[0].Name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $state ('.venv\' + $marker)))) {
            throw 'Selected prior program environment was not activated'
          }
          $retained = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*')
          if ($retained.Count -lt 1) { throw 'Previously active environment was not retained' }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '1.0.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fingerprint = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          $rejected = $false
          try { & (Join-Path $staging 'windows-worker.ps1') -Action Rollback -BackupName '..\other' | Out-Null }
          catch { $rejected = $true }
          if (!$rejected) { throw 'Untrusted rollback path was accepted' }
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $fingerprint) {
            throw 'Rejected rollback request changed active interpreter'
          }
      - name: Exercise installed Windows PowerShell 5.1 mail and labels
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s tests -p test_windows_customer_worker_integration.py -v
      - name: Retain exact accepted Windows customer ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kleinanzeiger-windows-${{ github.sha }}
          path: Kleinanzeiger-v1.0.14-Windows.zip
          if-no-files-found: error
          retention-days: 30

  publish-windows-release:
    name: publish-windows-v1.0.14
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: native-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact release-notes source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify tested ZIP and publish immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          release_tag='v1.0.14'
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v1.0.14 already published; leaving unchanged'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo 'v1.0.14 tag exists without a release; refusing to replace'
            exit 1
          fi
          stage="$RUNNER_TEMP/kleinanzeiger-release-v1.0.14"
          mkdir -p "$stage" "$stage/unpacked"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "kleinanzeiger-windows-$GITHUB_SHA" --dir "$stage"
          zip="$stage/Kleinanzeiger-v1.0.14-Windows.zip"
          test -s "$zip"
          unzip -t "$zip"
          unzip -q "$zip" -d "$stage/unpacked"
          (cd "$stage/unpacked" && sha256sum -c SHA256SUMS.txt)
          test -s "$stage/unpacked/kleinanzeiger-1.0.14-py3-none-any.whl"
          test -s "$stage/unpacked/Windows-Installation.md"
          test -s "$stage/unpacked/Kleinanzeiger-Handbuch.html"
          test -s "$stage/unpacked/START-HIER.html"
          test -s "$stage/unpacked/CHANGELOG.md"
          test -s "$stage/unpacked/Kleinanzeiger-Funktionen.html"
          test -s "$stage/unpacked/Konto-Nachrichten.md"
          test -s "$stage/unpacked/Kleinanzeiger.cmd"
          test -s "$stage/unpacked/windows-center.ps1"
          test -s "$stage/unpacked/windows-worker.ps1"
          test -s "$stage/unpacked/windows-messages.ps1"
          test -s "$stage/unpacked/windows-weekly-report.ps1"
          test -s "$stage/unpacked/windows-diagnostics.ps1"
          test -s "$stage/unpacked/Kleinanzeiger-Diagnose.cmd"
          test -s "$stage/unpacked/windows-offline-compat.py"
          test -s "$stage/unpacked/windows-restore-existing.py"
          zip_sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          printf '%s  %s\n' "$zip_sha" "Kleinanzeiger-v1.0.14-Windows.zip" > "$stage/Kleinanzeiger-v1.0.14-Windows.sha256"
          wheel="$stage/unpacked/kleinanzeiger-1.0.14-py3-none-any.whl"
          wheel_sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          zip_bytes="$(stat -c%s "$zip")"
          wheel_bytes="$(stat -c%s "$wheel")"
          printf '{"version":"1.0.14","tag":"%s","source_commit":"%s","workflow_run_id":"%s","windows_zip":{"filename":"Kleinanzeiger-v1.0.14-Windows.zip","bytes":%s,"sha256":"%s"},"wheel":{"filename":"kleinanzeiger-1.0.14-py3-none-any.whl","bytes":%s,"sha256":"%s"}}\n' \
            "$release_tag" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$zip_bytes" "$zip_sha" "$wheel_bytes" "$wheel_sha" > "$stage/Kleinanzeiger-v1.0.14-Release-Manifest.json"
          jq -e '.version == "1.0.14" and (.source_commit | length == 40)' "$stage/Kleinanzeiger-v1.0.14-Release-Manifest.json" >/dev/null
          python3 tools/release_notes.py --current > "$stage/Kleinanzeiger-v1.0.14-Release-Notes.md"
          test -s "$stage/Kleinanzeiger-v1.0.14-Release-Notes.md"
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Kleinanzeiger 1.0.14 – Windows' \
            --notes-file "$stage/Kleinanzeiger-v1.0.14-Release-Notes.md" \
            "$zip" \
            "$stage/Kleinanzeiger-v1.0.14-Windows.sha256" \
            "$stage/Kleinanzeiger-v1.0.14-Release-Manifest.json"