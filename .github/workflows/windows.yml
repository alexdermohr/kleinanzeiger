name: Native Windows installed customer acceptance
on:
  push:
    branches: [main, feat/kleinanzeiger-native-windows-20261025, fix/manage-ad-selector-20261025]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    name: windows-installed-py${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Checkout Windows candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Node 22 for installed real-browser acceptance
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build tested distributable Wheel and install customer extras
        shell: pwsh
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = @(Get-ChildItem -Path dist -Filter 'kleinanzeiger-*.whl')
          if ($wheel.Count -ne 1) { throw 'Exactly one Kleinanzeiger wheel required' }
          python -m pip install "$($wheel[0].FullName)[private-web,generation]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mark_api.launcher --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows kernel exclusion, SQLite lock, staged-media restart
        run: python -m unittest discover -s tests -p test_windows_compat.py -v
      - name: Windows installed backup and create-only restore
        run: python -m unittest discover -s tests -p test_windows_backup.py -v
      - name: Installed Windows binary media round-trip
        run: python -m unittest discover -s tests -p test_windows_binary_media.py -v
      - name: Installed full dashboard and write lifecycle
        run: python -m unittest discover -s tests -p test_dashboard_full_lifecycle_e2e.py -v
      - name: Installed synthetic create and media lifecycle
        run: python -m unittest discover -s tests -p test_dashboard_media_full_lifecycle_e2e.py -v
      - name: Installed synthetic text/image generation dashboard
        run: python -m unittest discover -s tests -p test_generation_dashboard.py -v
      - name: Installed ad selector and Windows installer contract
        shell: python
        run: |
          import subprocess
          import sys
          import shutil
          sys.path.insert(0, 'tests')
          from test_offline_browser_e2e import _chrome
          assert _chrome() and shutil.which('node'), 'Real installed browser acceptance cannot be skipped'
          assert shutil.which('powershell.exe'), 'Native PowerShell start acceptance cannot be skipped'
          for pattern in (
              "test_dashboard_managed_ad_picker.py",
              "test_dashboard_workspace_ux.py",
              "test_dashboard_manual_sync.py",
              "test_portfolio_catalog_ui.py",
              "test_portfolio_bulk_ui.py",
              "test_portfolio_buyer_reply_ui.py",
              "test_portfolio_catalog.py",
              "test_portfolio_drafts.py",
              "test_portfolio_drafts_http.py",
              "test_portfolio_drafts_ui.py",
              "test_portfolio_jobs.py",
              "test_portfolio_jobs_http.py",
              "test_portfolio_jobs_ui.py",
              "test_portfolio_provider.py",
              "test_portfolio_inventory_diff.py",
              "test_portfolio_item_templates.py",
              "test_portfolio_item_templates_http.py",
              "test_portfolio_item_templates_ui.py",
              "test_portfolio_price_rules.py",
              "test_product_offline_workspace.py",
              "test_portfolio_insights_http.py",
              "test_portfolio_insights_ui.py",
              "test_offline_browser_e2e.py",
              "test_windows_offline_start.py",
              "test_portfolio_templates.py",
              "test_portfolio_templates_http.py",
              "test_portfolio_templates_ui.py",
              "test_portfolio_followups.py",
              "test_portfolio_followups_http.py",
              "test_portfolio_followups_ui.py",
              "test_windows_customer_hub.py",
              "test_windows_installer_scripts.py",
              "test_windows_hub.py",
              "test_windows_startup_readiness.py",
          ):
              result = subprocess.run(
                  [sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", pattern, "-v"],
                  capture_output=True, text=True, check=False
              )
              print(result.stdout, flush=True)
              print(result.stderr, file=sys.stderr, flush=True)
              if result.returncode:
                  summary = (result.stdout + "\n" + result.stderr)[-6000:]
                  summary = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error file=tests/" + pattern + ",title=Windows acceptance failure::" + summary, flush=True)
                  raise SystemExit(result.returncode)
      - name: Parse customer PowerShell scripts
        shell: pwsh
        run: |
          foreach ($script in @('windows-install.ps1', 'windows-start.ps1', 'windows-chrome.ps1', 'windows-ki-einrichten.ps1', 'windows-center.ps1', 'windows-worker.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path (Join-Path scripts $script)).Path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script has invalid PowerShell syntax: $errors" }
          }
      - name: Native Windows one-window setup and worker self-tests
        shell: pwsh
        run: |
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-center.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File scripts/windows-worker.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack native Windows customer ZIP from tested Wheel
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          $wheel = @(Get-ChildItem -Path dist -Filter 'kleinanzeiger-*.whl')
          if ($wheel.Count -ne 1) { throw 'Expected exactly one Wheel' }
          Copy-Item $wheel[0].FullName $staging
          Copy-Item scripts\Kleinanzeiger.cmd, scripts\windows-center.ps1, scripts\windows-worker.ps1, scripts\windows-install.ps1, scripts\windows-start.ps1, scripts\windows-backup.ps1, scripts\windows-restore.ps1, scripts\windows-chrome.ps1, scripts\windows-ki-einrichten.ps1 $staging
          Copy-Item docs\windows-installation.md (Join-Path $staging 'Windows-Installation.md')
          Copy-Item docs\Kleinanzeiger-Handbuch.html, docs\Kleinanzeiger-Funktionen.html $staging
          $digest = (Get-FileHash $wheel[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  $($wheel[0].Name)" | Set-Content -Path (Join-Path $staging 'SHA256SUMS.txt') -Encoding ascii
          Compress-Archive -Path "$staging\*" -DestinationPath 'Kleinanzeiger-v0.1.14-Windows.zip'
          $zipHash = (Get-FileHash 'Kleinanzeiger-v0.1.14-Windows.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "Windows Wheel SHA256 $digest"
          Write-Output "Windows customer ZIP SHA256 $zipHash"
      - name: Verify customer install script against packaged and hashed wheel
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          & (Join-Path $staging 'windows-worker.ps1') -Action Install -PackageDirectory $staging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hub = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger\App\Kleinanzeiger.cmd'
          if (-not (Test-Path -LiteralPath $hub -PathType Leaf)) { throw 'Stable customer shortcut target missing' }
          $installed = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger\.venv\Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) {
            throw 'Customer installation did not produce the venv Python executable'
          }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '0.1.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exercise the real Windows PowerShell 5.1 native-argument path after install.
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-center.ps1') -SelfTest -ExpectedInstalledVersion '0.1.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-worker.ps1') -SelfTest -ExpectedInstalledVersion '0.1.14'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Windows upgrade rollback and non-destructive failed staging
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          $state = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger'
          $installed = Join-Path $state '.venv\Scripts\python.exe'
          # Real second installation preserves its previous environment and data.
          & (Join-Path $staging 'windows-install.ps1')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $saved = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*')
          if ($saved.Count -lt 1) { throw 'No previous Windows environment was retained' }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '0.1.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Valid local checksum but invalid Wheel: installation must fail before activation.
          $broken = Join-Path $env:RUNNER_TEMP ('kleinanzeiger-broken-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $broken -Force | Out-Null
          Copy-Item (Join-Path $staging 'windows-install.ps1') $broken
          $badWheel = Join-Path $broken 'kleinanzeiger-0.1.14-py3-none-any.whl'
          [IO.File]::WriteAllText($badWheel, 'invalid wheel archive')
          $sha = (Get-FileHash -LiteralPath $badWheel -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  kleinanzeiger-0.1.14-py3-none-any.whl" | Set-Content -Path (Join-Path $broken 'SHA256SUMS.txt') -Encoding ascii
          $before = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          $failed = $false
          try { & (Join-Path $broken 'windows-install.ps1') | Out-Null } catch { $failed = $true }
          if (-not $failed) { throw 'Broken staged Wheel unexpectedly installed' }
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $before) {
            throw 'Existing interpreter changed during failed staged install'
          }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '0.1.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows manual rollback and untrusted path rejection
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'kleinanzeiger-windows'
          $state = Join-Path $env:LOCALAPPDATA 'Kleinanzeiger'
          $installed = Join-Path $state '.venv\Scripts\python.exe'
          $candidate = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*' |
            Sort-Object Name -Descending | Select-Object -First 1)
          if ($candidate.Count -ne 1) { throw 'No saved rollback environment' }
          $marker = 'kleinanzeiger-rollback-e2e.marker'
          [IO.File]::WriteAllText((Join-Path $candidate[0].FullName $marker), 'saved-environment')
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $staging 'windows-worker.ps1') -Action Rollback -BackupName $candidate[0].Name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath (Join-Path $state ('.venv\' + $marker)))) {
            throw 'Selected prior program environment was not activated'
          }
          $retained = @(Get-ChildItem -LiteralPath $state -Directory -Filter '.venv-rollback-*')
          if ($retained.Count -lt 1) { throw 'Previously active environment was not retained' }
          & $installed -c "from importlib.metadata import version; assert version('kleinanzeiger') == '0.1.14'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $fingerprint = (Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash
          $rejected = $false
          try { & (Join-Path $staging 'windows-worker.ps1') -Action Rollback -BackupName '..\other' | Out-Null }
          catch { $rejected = $true }
          if (!$rejected) { throw 'Untrusted rollback path was accepted' }
          if ((Get-FileHash -LiteralPath $installed -Algorithm SHA256).Hash -ne $fingerprint) {
            throw 'Rejected rollback request changed active interpreter'
          }
      - name: Exercise installed Windows PowerShell 5.1 mail and labels
        if: matrix.python-version == '3.12'
        run: python -m unittest discover -s tests -p test_windows_customer_worker_integration.py -v
      - name: Retain exact accepted Windows customer ZIP
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kleinanzeiger-windows-${{ github.sha }}
          path: Kleinanzeiger-v0.1.14-Windows.zip
          if-no-files-found: error
          retention-days: 30

  publish-windows-release:
    name: publish-windows-v0.1.14
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: native-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Verify tested ZIP and publish immutable versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'main'
          release_tag='v0.1.14'
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v0.1.14 already published; leaving unchanged'
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            echo 'v0.1.14 tag exists without a release; refusing to replace'
            exit 1
          fi
          stage="$RUNNER_TEMP/kleinanzeiger-release-v0.1.14"
          mkdir -p "$stage" "$stage/unpacked"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "kleinanzeiger-windows-$GITHUB_SHA" --dir "$stage"
          zip="$stage/Kleinanzeiger-v0.1.14-Windows.zip"
          test -s "$zip"
          unzip -t "$zip"
          unzip -q "$zip" -d "$stage/unpacked"
          (cd "$stage/unpacked" && sha256sum -c SHA256SUMS.txt)
          test -s "$stage/unpacked/kleinanzeiger-0.1.14-py3-none-any.whl"
          test -s "$stage/unpacked/Windows-Installation.md"
          test -s "$stage/unpacked/Kleinanzeiger-Handbuch.html"
          test -s "$stage/unpacked/Kleinanzeiger-Funktionen.html"
          test -s "$stage/unpacked/Kleinanzeiger.cmd"
          test -s "$stage/unpacked/windows-center.ps1"
          test -s "$stage/unpacked/windows-worker.ps1"
          zip_sha="$(sha256sum "$zip" | cut -d' ' -f1)"
          printf '%s  %s\n' "$zip_sha" "Kleinanzeiger-v0.1.14-Windows.zip" > "$stage/Kleinanzeiger-v0.1.14-Windows.sha256"
          wheel="$stage/unpacked/kleinanzeiger-0.1.14-py3-none-any.whl"
          wheel_sha="$(sha256sum "$wheel" | cut -d' ' -f1)"
          zip_bytes="$(stat -c%s "$zip")"
          wheel_bytes="$(stat -c%s "$wheel")"
          printf '{"version":"0.1.14","tag":"%s","source_commit":"%s","workflow_run_id":"%s","windows_zip":{"filename":"Kleinanzeiger-v0.1.14-Windows.zip","bytes":%s,"sha256":"%s"},"wheel":{"filename":"kleinanzeiger-0.1.14-py3-none-any.whl","bytes":%s,"sha256":"%s"}}\n' \
            "$release_tag" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$zip_bytes" "$zip_sha" "$wheel_bytes" "$wheel_sha" > "$stage/Kleinanzeiger-v0.1.14-Release-Manifest.json"
          jq -e '.version == "0.1.14" and (.source_commit | length == 40)' "$stage/Kleinanzeiger-v0.1.14-Release-Manifest.json" >/dev/null
          cat > "$stage/Kleinanzeiger-v0.1.14-Release-Notes.md" <<'EOF'
          # Kleinanzeiger v0.1.14 – Windows
          - Frühere Programmversion im zentralen Windows-Kontrollfenster auswählen, bestätigen und sicher wieder aktivieren; vorhandene Anzeigen, Sicherungen und Chrome-Profile bleiben unverändert
          - Native Windows-3.12-Abnahme mit echtem Programmverzeichniswechsel, Rückfallkopie und abgewiesenem Fremdpfad
          - Rollbackfähige Windows-Updates: neue Python-Umgebung vollständig getrennt installieren, Paket und Start prüfen, vorherige Version erhalten und bei Aktivierungsfehler automatisch zurückwechseln
          - Windows-Negativtest mit gültiger SHA256, aber defektem Paket: vorherige Installation bleibt unverändert; zweite echte Installation erhält Rückfallkopie
          - Sicherer lokaler Arbeitsmodus bei ausgefallenem Browser oder Inventarabruf: gespeicherte Daten sichtbar, lokale Arbeit möglich, keinerlei Plattform-Writer
          - Erneuter Abgleich nur auf Wunsch; fehlgeschlagene Reads löschen keinen Bestand; Plattformänderungen erst nach Neustart und erneut bestätigtem Eigenbestand
          - G4: Bestandsänderungen im Dashboard mit Originalvergleich, Quelle, Zeitpunkt und Schutz vor Seitendrift
          - G5: Lokale Preisregeln für importierte Artikel mit Ausgangspreis, Mindestpreis, Schritt, Wartezeit und Vorschau; keine automatische Preisänderung
          - Echte Browser-Abnahme der ausgelieferten Oberfläche sowie native Windows-Start-Negativtests ohne reale Konten oder kostenpflichtige KI
          - Kunden-PC-Endabnahme und externe Plattformberechtigungen sind weiterhin separat erforderlich
          - Kompaktes Windows-Kontrollfenster: Start, Update, Konto, Import, Sicherung und KI sofort erreichbar; seltene Aktionen unter Weitere Aktionen
          - Fehlerdetails nur bei tatsächlichem Fehler einblenden; vorhandene Daten, Chrome-Profil und Backups bleiben erhalten
          - Dashboard mit fünf Hauptbereichen und einklappbarer Navigation zu selteneren Aufgaben
          - Kontextbezogene, während der Auswahl sichtbare Aktionsleiste; bei >10 Anzeigen sicher erklärter Grenzwert
          - Keine Änderung an geschützten Plattformschreibvorgängen, Recovery- oder KI-Kostenfreigaben
          - Windows-Start: mehrere vorhandene Chrome-Tabs sicher behandeln; nur den kanonischen eigenen Anzeigen-Tab auswählen und dessen CDP-Identität während der Sitzung binden
          - Gesonderte Fehlergründe bei nicht bereitem Tab und sichtbarer Link Fehlerdetails anzeigen statt vermeintlichem Loginfehler
          - Startzuverlässigkeit: Chrome-Debugging begrenzt prüfen; bei Lesefehler sicher lokal weiterarbeiten statt pauschaler Login-Vermutung

          - Ein einziges Kleinanzeiger-Fenster für Einrichtung, Start, Update, Backup und KI-Zugang
          - Bis zu 50 Anzeigen pro Katalogseite statt kompletten Bestands im Browser
          - Titelsuche, ID-Suche, Statusfilter, Vor/Zurück und seitenübergreifende Auswahl
          - G1: Bis zu 10.000 lokale manuelle Wiedervorlagen mit Status überfällig/bald fällig; Plattform-Ablaufdaten bleiben unbekannt, keine automatische Verlängerung
          - Lokaler CSV-Export der ausgewählten Anzeigen-IDs ohne Massen-Write
          - CSV-/Excel-Import bis 5.000 lokale Artikelentwürfe: Vorschau, Prüfsummen, atomare Übernahme
          - Artikelnummern-Dubletten- und Fehlerprüfung, Entwurfs-Pagination im Dashboard, Export und Formularübernahme
          - Lokale KI-Stapelverwaltung für bis zu 5.000 Artikel mit Paginierung, Freigabe und atomarer lokaler Übernahme
          - Freigegebene KI-Einzelaufrufe oder bis zu zehn sequenzielle Anfragen pro Kundenaktion; Budgetreserve, manuelles Stoppen, UNKNOWN-Sperre
          - Keine automatische Plattform-Massenveröffentlichung; 10.000 synthetische Anzeigen im Katalog getestet
          - Eigene Anzeigen in geprüften Stapeln von höchstens zehn einzeln pausieren/aktivieren; kontrollierte Sammellöschung nur nach Vorschau und zusätzlich exakter Eingabe LÖSCHEN N
          - Vor jedem Write exakte Anzeigenbeobachtung prüfen, bestätigt ausgeführte IDs anzeigen, bei UNKNOWN/Recovery/Stopp sofort weitere Aktionen sperren
          - P3: Lagerorte, lokale Reservierungen und manuell verbuchte Verkäufe mit bekannten/unbekannten Kosten
          - P4: 7/30/90-Tage-Controlling, CSV-Tageszahlen, getrennte Erlöse und geschätzte KI-Ausgaben
          - P5: Bis zu 100 KI-Arbeitsvorlagen und passive Hinweise auf offene Prüfaufgaben
          - Nicht enthalten: Konto-Nachrichtenversand, unbeaufsichtigte Plattform-Massenaktionen, automatische Massenpreisänderungen, Autopilot, verifizierte KI-Providerrechnung
          - Lokale Kleinanzeigen-E-Mails und Vergleichslabels über zentrale Bedienelemente pflegen
          - Vollständiges HTML-Benutzerhandbuch und Funktionsübersicht im Kundenpaket
          - Anzeigen ohne Neustart live mit Kleinanzeigen abgleichen; lokale Ansicht getrennt neu laden
          - Nach Installation stabiler Desktop-Start, Dashboard wird automatisch geöffnet
          - Automatische Sicherung vor Updates; geschützte Daten bleiben erhalten
          - Vorhandene Daten, Chrome-Profil und offene Write-Recovery-Zustände bleiben beim Update erhalten

          Installation und Update: ZIP entpacken und Kleinanzeiger.cmd öffnen.
          Einrichtung, Start, Sicherung, Update und optionaler KI-Zugang im selben Fenster.
          Keine echten Plattform-Schreibaktionen oder kostenpflichtige KI-Aufrufe wurden
          während der synthetischen technischen Abnahme ausgelöst.
          EOF
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Kleinanzeiger v0.1.14 – Windows' \
            --notes-file "$stage/Kleinanzeiger-v0.1.14-Release-Notes.md" \
            "$zip" \
            "$stage/Kleinanzeiger-v0.1.14-Windows.sha256" \
            "$stage/Kleinanzeiger-v0.1.14-Release-Manifest.json" \
            "$stage/Kleinanzeiger-v0.1.14-Release-Notes.md" \
            "$stage/unpacked/Windows-Installation.md" \
            "$stage/unpacked/Kleinanzeiger-Handbuch.html" \
            "$stage/unpacked/Kleinanzeiger-Funktionen.html" \
            "$stage/unpacked/SHA256SUMS.txt" \
            "$stage/unpacked/kleinanzeiger-0.1.14-py3-none-any.whl"