---
name: Installed offline wheel acceptance
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  installed-offline:
    name: installed-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distributable wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mark-wheels"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/mark-wheels" .
      - name: Exercise installed distribution and denied platform writes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=( "$RUNNER_TEMP"/mark-wheels/mark_api-*.whl )
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Exactly one mark-api wheel required" >&2
            exit 1
          fi
          MARK_WHEEL_PATH="${wheels[0]}" python -m unittest discover -s tests -p test_offline_wheel_acceptance.py -v
