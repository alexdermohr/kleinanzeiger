---
name: Installed offline wheel acceptance
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  installed-offline:
    name: installed-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build distributable wheel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mark-wheels"
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/mark-wheels" .
      - name: Exercise installed distribution and denied platform writes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=( "$RUNNER_TEMP"/mark-wheels/mark_api-*.whl )
          if [[ ${#wheels[@]} -ne 1 ]]; then
            echo "Exactly one mark-api wheel required" >&2
            exit 1
          fi
          # GitHub hosted runners may deny unprivileged userns uid_map writes.
          # Only the fixed setup runs as host root. The wheel test itself runs
          # in new network + PID + mount namespaces with NO new privileges and
          # ALL capability sets/bounding privileges dropped before Python starts.
          test -x "$(command -v unshare)"
          test -x "$(command -v ip)"
          test -x "$(command -v sudo)"
          test -x "$(command -v setpriv)"
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          python_bin="$(command -v python)"
          report="$RUNNER_TEMP/mark-offline-wheel-e2e.log"
          sudo -n unshare --net --pid --fork --mount-proc -- bash -c '
            set -euo pipefail
            ip link set lo up
            exec setpriv --reuid "$1" --regid "$2" --clear-groups \
              --no-new-privs --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
              env "MARK_WHEEL_PATH=$3" "$4" -m unittest discover -s tests -p test_offline_wheel_acceptance.py -v
          ' bash "$runner_uid" "$runner_gid" "${wheels[0]}" "$python_bin" 2>&1 | tee "$report"
          # No skipped acceptance, empty discovery, or "success without tests".
          grep -Eq '^Ran 1 test in [0-9.]+' "$report"
          grep -Eq '^OK$' "$report"
          grep -Fq '"result": "PASS"' "$report"