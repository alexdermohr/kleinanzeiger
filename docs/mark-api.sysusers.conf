# Root-managed, non-login identity shared only by the trusted Mark runtime
# and its guarded SQLite online-backup command. Never use it for an interactive
# browser session or arbitrary third-party code.
u mark-api 50042 "Isolated Mark dashboard frontend" /var/lib/mark-api /usr/sbin/nologin
u mark-api-witness 50043 "Independent Mark recovery witness" /var/lib/mark-fence /usr/sbin/nologin
u mark-api-owner 50044 "Trusted Mark browser and SQLite executor" /var/lib/mark-api /usr/sbin/nologin
u mark-api-ingress 50045 "Loopback-only HTTP to netless frontend" /nonexistent /usr/sbin/nologin