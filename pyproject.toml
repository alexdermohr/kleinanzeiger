[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kleinanzeiger"
version = "0.1.27"
description = "Kleinanzeiger: Anzeigenverwaltung, Synchronisation, Auswertung und KI-Unterstützung"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
private-web = ["websocket-client>=1.8,<2", "Pillow>=10.4,<13", "openpyxl>=3.1,<4"]
generation = ["openai>=2.11,<3"]

[project.scripts]
kleinanzeiger = "kleinanzeiger.cli:launcher"
kleinanzeiger-linux = "kleinanzeiger.linux_launcher:main"
kleinanzeiger-dashboard = "kleinanzeiger.cli:dashboard"
kleinanzeiger-nachrichten = "mark_api.platform_messages:main"
kleinanzeiger-protected-frontend = "kleinanzeiger.cli:protected_frontend"
kleinanzeiger-protected-owner = "kleinanzeiger.cli:protected_owner"
kleinanzeiger-protected-actor = "kleinanzeiger.cli:protected_actor"
kleinanzeiger-protected-witness = "kleinanzeiger.cli:protected_witness"
kleinanzeiger-protected = "kleinanzeiger.cli:protected"
kleinanzeiger-protected-pair = "kleinanzeiger.cli:protected_pair"
kleinanzeiger-offline = "kleinanzeiger.cli:offline"
kleinanzeiger-generate = "kleinanzeiger.cli:generate"
kleinanzeiger-backup = "kleinanzeiger.cli:backup"
kleinanzeiger-windows-restore = "kleinanzeiger.cli:windows_restore"
kleinanzeiger-sync = "kleinanzeiger.cli:sync"
kleinanzeiger-import-mail = "kleinanzeiger.cli:import_mail"
kleinanzeiger-import-articles = "kleinanzeiger.cli:import_articles"
kleinanzeiger-ki-auftraege = "kleinanzeiger.cli:ki_auftraege"
kleinanzeiger-local-smoke = "kleinanzeiger.cli:local_smoke"
kleinanzeiger-classify = "kleinanzeiger.cli:classify"
kleinanzeiger-migrate-legacy = "kleinanzeiger.cli:migrate_legacy"
mark-api-dashboard = "mark_api.dashboard:main"
mark-api-offline = "mark_api.offline_launcher:main"
mark-api-classify = "mark_api.classification_cli:main"
mark-api-import-mail = "mark_api.email_import_cli:main"
mark-api-local-smoke = "mark_api.local_smoke:main"
mark-api-launch = "mark_api.launcher:main"
mark-api-inventory-sync = "mark_api.owner_inventory_cli:main"
mark-api-migrate-legacy = "mark_api.legacy_migration:main"
mark-api-generate = "mark_api.generation_cli:main"
mark-api-backup = "mark_api.backup_cli:main"
mark-api-sync = "mark_api.periodic_sync:main"
mark-api-pair-restore-check = "mark_api.paired_restore_preflight:main"
kleinanzeiger-pair-restore-check = "kleinanzeiger.cli:pair_restore_check"

[tool.setuptools.packages.find]
where = ["src"]